const sc=new R.Scene(),cam=new R.PerspectiveCamera(62,1,.1,400),rd=new R.WebGLRenderer({antialias:true});

const TC=[0x3f9b4f,0x8a4a2a,0x2a3f6a,0xff6ab8,0x7a4ad0,0xff6b8a,0x3a2a4a,0x5aa05a,0x4a5aff],STW=[2,4,6,8],S3=(g,m,x,y,z,a,b,c)=>{const o=mesh(g,m,x,y,z);o.scale.set(a,b==null?a:b,c==null?a:c);return o};

function mkAcc(G){const a=[null];
 const sc1=new R.Group();sc1.add(mesh(new R.TorusGeometry(.62,.2,8,16),M(0xe0334f),0,.5,-1.6),mesh(new R.BoxGeometry(.3,1,.12),M(0xe0334f),.35,0,-1.45));
 const bw=new R.Group();[-1,1].forEach(q=>{const c=mesh(new R.ConeGeometry(.28,.6,4),M(0xff4d9a),q*.4,.15,-1.9);c.rotation.z=-q*Math.PI/2;bw.add(c)});bw.add(S3(SPH,M(0xffd36b),0,.15,-1.9,.16));
 const sg=new R.Group();sg.add(mesh(new R.BoxGeometry(.95,.24,.12),M(0x16161e),0,1.05,-3.02));
 const fl=new R.Group();[0xff7aa8,0xffffff,0xffd36b,0xff7aa8,0xffffff].forEach((c,i)=>fl.add(S3(SPH,M(c),-.6+i*.3,1.55-Math.abs(i-2)*.08,-2.35,.17)));
 [sc1,bw,sg,fl].forEach(x=>{x.visible=false;G.add(x);a.push(x)});const sb=S3(SPH,M(0x5ac8fa,{transparent:true,opacity:.28}),0,.3,0,2.7,2.2,3.4);sb.visible=false;G.add(sb);a.sb=sb;return a}
function mkBoss(c){const g=new R.Group(),pm=M(c||0x5a3a8a),sh=new R.Shape();sh.moveTo(0,0);sh.lineTo(4,-1.2);sh.lineTo(3,.4);sh.lineTo(1.8,-.4);sh.lineTo(0,1);

 const pv=new R.Group();pv.position.set(.5,1.8,0);const w=mesh(new R.ShapeGeometry(sh),M(0x3a2a6a,{side:R.DoubleSide}));w.scale.setScalar(1.5);w.rotation.z=.7;pv.add(w);g.add(pv);g.userData.p=pv;g.scale.setScalar(1.3);return g}

const WR=[['crown','Tiara',60],['crown','Flower crown',80],['crown','Star circlet',100],['cape','Red cape',70],['cape','Blue cape',70],['cape','Rainbow cape',150],['extra','Wand',90],['extra','Fairy wings',160],['extra','Heart necklace',60]];
function mkWr(i){const g=new R.Group(),ring=(cols,y,r)=>cols.forEach((c,j)=>{const a=j/cols.length*Math.PI*2;g.add(S3(SPH,M(c),Math.cos(a)*r,y,Math.sin(a)*r*.8,.09))});

 if(i==1)ring([0xff7aa8,0xffffff,0xffd36b,0xff7aa8,0xffffff,0xffd36b,0xff7aa8,0xffffff],1.22,.32);
 if(i==2)g.add(mesh(new R.OctahedronGeometry(.25),M(0xffe066,{emissive:0x886600}),0,1.45,0));
 if(i>=3&&i<=5){const cols=[[0xe0334f],[0x3a5ac8],[0xff6b6b,0xffd36b,0x6adf6a,0x6ab4ff]][i-3];cols.forEach((c,j)=>g.add(mesh(new R.BoxGeometry(.9/cols.length,1.3,.06),M(c),(j-(cols.length-1)/2)*.9/cols.length,.55,.34)))}
 if(i==6)g.add(mesh(new R.CylinderGeometry(.03,.03,.9,5),M(0xffe8a0),.55,.4,-.2),S3(SPH,M(0xffd36b,{emissive:0x886600}),.55,.9,-.2,.12));
 if(i==7)[-1,1].forEach(q=>{const w=S3(SPH,M(0xbfe8ff,{transparent:true,opacity:.75}),q*.55,.85,.38,.4,.55,.06);w.rotation.z=-q*.4;g.add(w)});
 if(i==8)g.add(mesh(new R.TorusGeometry(.2,.03,6,16),M(0xffd36b),0,.68,-.28),S3(SPH,M(0xff4d6d),0,.5,-.3,.07));

const SKN={4:{r:[0x9a6bff,'oct'],b:[0x6a3ac0],s:[0x4a2a8a],t:0x9a6bff},5:{r:[0xffc94a,'puff'],b:[0xff7aa8],s:[0xff8ac4],t:0xff7a9a},6:{r:[0xff8a1a,'pump'],b:[0xf0f0ff],s:[0x9a9aa8],t:0x4a3a5a},7:{r:[0xc98a3a,'pot'],b:[0x6a4a2a],s:[0xe8c070],t:0x4aa05a},8:{r:[0xaad8ff,'comet'],b:[0x6adf6a],s:[0x2a1a5a],t:0x6a8aff}};
function mkPr(){const g=new R.Group(),dm=M(0xff7aa8),hrm=M(0xf5b83c),cm=M(0xffd36b);
 const dress=mesh(new R.ConeGeometry(.5,1,10),dm,0,.3,0),sm=M(0xffd9b8),hd=mesh(SPH,sm,0,.95,0);hd.scale.setScalar(.3);
 const hair=mesh(SPH,hrm,0,.98,.1);hair.scale.setScalar(.34);const cr=mesh(new R.ConeGeometry(.2,.28,5),cm,0,1.3,0);
 [-1,1].forEach(q=>{const e=mesh(SPH,M(0x2b1b4a),q*.1,.98,-.26);e.scale.setScalar(.04);g.add(e)});
 const cv=document.createElement('canvas');cv.width=256;cv.height=128;const x=cv.getContext('2d');x.font='700 84px Fredoka,sans-serif';x.textAlign='center';x.lineWidth=14;x.strokeStyle='#7a3ad6';x.strokeText('MASA',128,92);x.fillStyle='#fff';x.fillText('MASA',128,92);

 const wr=WR.map((_,i)=>{const w=mkWr(i);g.add(w);return w});g.add(dress,hair,hd,cr,spr);g.userData={dm,hrm,cm,sm,spr,wr,cr,magic:0};return g}

 [-1,1].forEach(s=>{const e=mesh(SPH,M(0xffffff),s*.33,1.05,-2.8);e.scale.setScalar(.2);const p=mesh(SPH,M(0x1a1a2a),s*.33,1.05,-2.97);p.scale.setScalar(.1);

function mk(k){const g=new R.Group(),u={k,ph:Math.random()*6,burn:0,r:1.5},wi=G.w,sk=SKN[wi],pc=c=>M(c,{emissive:c,emissiveIntensity:.3});g.userData=u;

 if(tool=='feed'){if(mv||apple||munch>0)return;if(SV.hun>=99){Snd.sl(500,300,.2,'triangle');return}apple=mesh(new R.SphereGeometry(.35,10,8),M(0xe0342f),3,-3,5);sc.add(apple);Snd.sl(300,900,.25,'sine',.05);Snd.n(.25,1500,.06);return}
 if(!ray(e,D))return;
 if(tool=='trick'&&!mv&&trick<=0){trick=1.2;care();SV.coins++;Snd.sl(300,900,.3,'sine',.07);Snd.sl(600,300,.3,'triangle',.05)}
 if(tool=='wash'&&mv){SV.cle=Math.min(100,SV.cle+2);ac++;if(Snd.th('w',90))Snd.n(.13,2600,.08,2);if(Snd.th('wb',230))Snd.sl(700+Math.random()*600,1600,.09,'sine',.05);part(rp(),new R.Vector3(0,3,0),1,bubM);if(ac%10==0){if(SV.cle<97)SV.coins++;care()}}
 if(tool=='pet'&&mv){SV.lov=Math.min(100,SV.lov+1.5);ac++;if(Snd.th('p',110))Snd.sl(75,62,.14,'sawtooth',.05);if(Snd.th('pc',650))Snd.sl(520,820,.28,'sine',.04);if(ac%4==0)part(rp(),new R.Vector3(0,3,0),1,hrtM);if(ac%12==0){if(SV.lov<97)SV.coins++;care()}}
 if(tool=='hug'&&!mv&&hug<=0){hug=2.6;care();SV.lov=Math.min(100,SV.lov+22);if(SV.lov<97)SV.coins+=3;for(let i=0;i<8;i++)part(rp(),new R.Vector3(0,4,0),1.2,hrtM);[523,659,784].forEach((f,i)=>setTimeout(()=>Snd.p(f,.9,'sine',.06),i*120));Snd.n(.15,600,.07)}
 if(!mv||ac%10==0)save()}
function homeTick(dt){const st=G.st,pr=D.userData.pr;
 [pr,PR2,PR3].forEach(p=>{if(p.userData.magic)p.userData.dm.color.setHSL((T*.12)%1,.8,.72)});
 if(st=='home'){munch=Math.max(0,munch-dt);hug=Math.max(0,hug-dt);trick=Math.max(0,trick-dt);const wsh=down&&tool=='wash',pet=down&&tool=='pet';
  D.visible=true;const gs=.55+.45*Math.min(1,(SV.care||0)/120),tk=trick>0?(1.2-trick)/1.2:0;D.position.set(wsh?Math.sin(T*45)*.08:0,-8+1.3*gs+(tk?Math.sin(tk*Math.PI)*2.5:0),0);D.rotation.set(0,-.9+tk*Math.PI*2,pet?Math.sin(T*3)*.03:0);D.scale.setScalar(gs*(1+(hug>0?.04*Math.sin(T*10):0)+(munch>0?.03*Math.sin(T*22):0)));
  D.userData.wings.forEach((w,i)=>w.rotation.z=(i?1:-1)*(.2+Math.sin(T*1.5)*.05));pr.position.lerp(new R.Vector3(0,hug>0?1.5:1,hug>0?-2.3:.1),Math.min(1,dt*6));D.userData.dirt.opacity=Math.max(0,1-SV.cle/90)*.85;
  if(apple){const mp=D.localToWorld(new R.Vector3(0,.7,-3.2));apple.position.lerp(mp,Math.min(1,dt*5));if(apple.position.distanceTo(mp)<.5){sc.remove(apple);apple=null;munch=.9;care();SV.hun=Math.min(100,SV.hun+14);if(SV.hun<97)SV.coins+=2;[0,140,280].forEach(ms=>setTimeout(()=>Snd.n(.09,1800,.14,3),ms));setTimeout(()=>Snd.sl(240,110,.22,'sine',.09),480);save()}}}
 if(st=='castle'){D.visible=false;ELU.userData.arm.rotation.z=-2.3+Math.sin(T*5)*.4;ELU.position.y=-1+Math.sin(T*2)*.04;cs.talk=Math.max(0,cs.talk-dt);ELU.userData.head.scale.y=.6*(1+(cs.talk>0?Math.abs(Math.sin(T*12))*.08:0));if(cs.tw>0){cs.tw-=dt;PR2.rotation.y+=14*dt}else PR2.rotation.y=Math.sin(T)*.2}}
function castleTap(e){if(G.st!='castle'||!$('ov').classList.contains('hide'))return;if(ray(e,ELU)){eluOpen();Snd.p(1320,.5,'sine',.05)}else if(ray(e,PR2)){cs.tw=1.2;Snd.sl(800,1800,.45,'sine',.06)}}
const EQ=[[/masa/,'masa'],[/room|throne|ball|garden|bedroom|castle/,'rooms'],[/quest|task|mission|challenge/,'quests'],[/style|custom|colou?r|hair|outfit|look|wear|accessor/,'style'],[/coin|earn|money|point|rich/,'coins'],[/style|custom|colou?r|dress|outfit|look|wear|shop|buy|unlock|dragon/,'shop'],[/world|level|where|map/,'worlds'],[/care|feed|wash|pet|hug|hungry|dirty/,'care'],[/fly|play|race/,'fly'],[/gift|free|present/,'gift'],[/hello|\bhi\b|hey/,'hi'],[/thank/,'thx']];
function say(t){cs.talk=2.5;$('et').textContent=t;$('elu').classList.remove('hide');Snd.sl(500,650,.1,'triangle',.05)}
function eluOpen(g){const h=new Date().getHours();say((g?(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', Your Highness! Welcome to Crown Jewel Castle! I am Elu, your concierge. ':'')+'How may I help you today?');$('eb').innerHTML=[['coins','🪙 Earn coins'],['quests','📜 Quests'],['rooms','🚪 Rooms'],['style','🎨 Style Studio'],['shop','🛍️ Shop & outfits'],['worlds','🌍 Worlds'],['care','🍎 Care tips'],['fly','✈️ Go flying'],['gift','🎁 Daily gift']].map(([k,n])=>`<button onclick="eluAct('${k}')">${n}</button>`).join('')}
function eluAct(k){const td=new Date().toDateString();
 if(k=='style'){say('Right away, Your Highness!');studio()}else if(k=='rooms'){say('Of course, Your Highness!');rooms()}else if(k=='quests')quests();else if(k=='coins')say('You earn 🪙 by flying: burn rocks and bats and grab coins. Feeding, washing, petting and hugging Ember earns coins too.');
 else if(k=='shop'){say('The royal shop awaits!');shop()}
 else if(k=='fly'){say('Off you go! Dodge the storms and thorns!');setTimeout(start,700)}
 else if(k=='care')say('Ember gets hungry, dirty and lonely over time. Visit home and use Feed, Wash, Pet and Hug.');
 else if(k=='worlds'){const nx=WN.findIndex((w,i)=>!SV.wo.includes(i));say(`You own ${SV.wo.length} of ${WN.length} worlds. `+(nx>=0?`Next: ${WN[nx][0]} for ${WN[nx][1]} 🪙.`:'You have them all!'))}
 else if(k=='gift'){if(SV.gift!=td){const y=new Date(Date.now()-864e5).toDateString();SV.streak=SV.gift==y?Math.min(7,(SV.streak||0)+1):1;const gg=20+5*SV.streak;SV.gift=td;SV.coins+=gg;save();say('Day '+SV.streak+' gift: '+gg+' 🪙! Come back tomorrow for more (a 7-day streak is the best).');[660,880,1100].forEach((f,i)=>setTimeout(()=>Snd.p(f,.2,'sine',.07),i*100))}else say('You already took today\'s gift. Come back tomorrow!')}
 else if(k=='masa')say('Her shimmering gown spells MASA in magic thread!');else if(k=='hi')say('Hello hello! What can I do for you?');else if(k=='thx')say('My pleasure, Your Highness!')}
function ask(){const q=$('ei').value.toLowerCase();$('ei').value='';if(!q)return;const m=EQ.find(e=>e[0].test(q));m?eluAct(m[1]):say('Hmm, I am not sure, but I can help with coins, the shop, worlds, care tips or flying.')}
/* ---- shop ---- */
const KS={d:[DR,'dr','sd'],o:[OU,'ot','so'],w:[WN,'wo','sw']},hx=n=>'#'+n.toString(16).padStart(6,'0');
function shop(){const sec=(t,k,f)=>{const[a,ow,sl]=KS[k];return`<h2>${t}</h2><div class=grid>`+a.map((x,i)=>`<div class="it ${SV[sl]==i?'sel':''}"><div class=sw style="background:${f(i)}"></div><small>${x[0]}${k=='d'?'<br><i style="font-weight:400">'+AB_TXT[i]+'</i>':''}</small>${SV[ow].includes(i)?`<button onclick="pick('${k}',${i})">${SV[sl]==i?'In use':'Use'}</button>`:`<button style="background:#ff7aa8" onclick="buy('${k}',${i})">🪙 ${x[1]}</button>`}</div>`).join('')+'</div>'};
 ov(`<h1>Shop 🛍️</h1><p>You have 🪙 ${SV.coins}</p>${sec('Dragons','d',i=>`linear-gradient(135deg,${hx(DR[i][2])},${hx(DR[i][3])})`)}${sec('Princess outfits','o',i=>`linear-gradient(135deg,${hx(OU[i][2])},${hx(OU[i][4])})`)}${sec('Worlds','w',i=>`linear-gradient(${hx(PAL[i].sky)},${hx(PAL[i].gr)})`)}${wardrobeSec()}${decorSec()}<p><button onclick="$('ov').classList.add('hide')">Back</button></p>`)}
function buy(k,i){const[a,ow,sl]=KS[k];if(SV.coins>=a[i][1]){SV.coins-=a[i][1];SV[ow].push(i);SV[sl]=i;save();applyStyle();shop();[660,880,1100].forEach((f,j)=>setTimeout(()=>Snd.p(f,.2,'sine',.07),j*90))}else{Snd.p(150,.25,'sawtooth',.06);toast('Not enough coins yet!')}}
function pick(k,i){SV[KS[k][2]]=i;save();applyStyle();shop();Snd.p(600,.08,'triangle')}
/* ---- extras: abilities, bosses, quests, growth, photo, parent corner ---- */
const ABIL=[{},{sh:1},{wide:1,blue:1},{mag:1},{coin:1.25}],AB_TXT=['Classic','Starts with a shield','Ice flames, wider fire','Coin magnet','+25% coins'];
const BOSS=[['Storm Wyrm',0x5a3a8a],['Canyon Tyrant',0xc8553a],['Night Terror',0x2a2f6a],['Gumdrop Gobbler',0xff6ab8],['Crystal Colossus',0x7a4ad0],['Reef Kraken',0xd04a6a],['Phantom Drake',0x8a8ab8],['Sand Serpent',0xc98a3a],['Star Eater',0x3a4ac0]];
const QD=[['burn','🔥 Burn 10 things',10,15],['coins','🪙 Grab 8 coins flying',8,15],['care','🤗 Care for Ember 12 times',12,20],['score','⭐ Score 300 in a flight',300,25],['rescue','🐰 Rescue 1 animal',1,25]];
function qinit(){const td=new Date().toDateString();if(!SV.q||SV.q.d!=td)SV.q={d:td,p:{burn:0,coins:0,care:0,score:0,rescue:0},c:{}};SV.q.p.rescue=SV.q.p.rescue||0}
function qa(k,n=1){qinit();SV.q.p[k]+=n}function qm(k,v){qinit();SV.q.p[k]=Math.max(SV.q.p[k],v)}function care(){SV.care=(SV.care||0)+1;qa('care')}
const stage=()=>(SV.care||0)<25?'Baby':(SV.care||0)<80?'Teen':'Adult';
function quests(){qinit();let got=0;const tx=QD.map(([k,t,n,rw])=>{const done=SV.q.p[k]>=n;if(done&&!SV.q.c[k]){SV.q.c[k]=1;SV.coins+=rw;got+=rw}return`${t}: ${Math.min(SV.q.p[k],n)}/${n}${SV.q.c[k]?' ✅':''}`}).join('  |  ');save();say((got?`Quest reward: +${got} 🪙! `:'')+'Today: '+tx)}
function photo(){rd.render(sc,cam);const a=document.createElement('a');a.href=rd.domElement.toDataURL('image/png');a.download='ember-photo.png';a.click();Snd.n(.1,3000,.1);toast('📸 Photo saved!')}
function togSnd(){Snd.on=!Snd.on;$('snd').textContent=Snd.on?'🔊':'🔇'}
function parentCorner(){const m=Math.floor((SV.pt||0)/60);ov(`<h1>Parent corner ⚙️</h1><p>Play time today: <b>${m} min</b></p><p><button onclick="togSnd();parentCorner()">Sound: ${Snd.on?'ON':'OFF'}</button></p><p><button onclick="if(confirm('Erase ALL saved progress?')){localStorage.removeItem('ember3d');location.reload()}">Erase progress</button></p><p><button style="background:#ff7aa8" onclick="$('ov').classList.add('hide')">Close</button></p>`)}
setInterval(()=>{if(document.hidden)return;const td=new Date().toDateString();if(SV.ptd!=td){SV.ptd=td;SV.pt=0}SV.pt=(SV.pt||0)+1},1000);setInterval(save,10000);
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
/* ---- modes ---- */
const HINT={feed:'Tap anywhere to throw an apple 🍎',wash:'Drag over the dragon to scrub 🧽',pet:'Drag over the dragon to stroke 🖐️',hug:'Tap the dragon for a hug 🤗',trick:'Tap the dragon for a trick 🎪'};
function setTool(t){tool=t;Snd.init();Snd.p(520,.07,'triangle');ui('home')}
function ui(m){const pl=m=='play',cas=m=='castle';$('pad').classList.toggle('hide',!pl);$('fire').classList.toggle('hide',!pl);const rm_=!!RX[m];Object.keys(ROOM).forEach(k=>ROOM[k].visible=m==k);scen.forEach(o=>o.visible=!rm_);clouds.forEach(c=>c.visible=!rm_);gnd.visible=!rm_;
 const mg=(m=='home'||rm_)?1:0;D.userData.pr.userData.magic=mg;D.userData.pr.userData.spr.visible=!!mg;PR2.userData.magic=1;PR2.userData.spr.visible=true;PR3.userData.magic=1;PR3.userData.spr.visible=true;applyStyle();if(rm_)stars.visible=false;D.userData.acc.sb.visible=false;D2.visible=false;
 if(pl){D.rotation.order='YXZ';D.rotation.set(0,-Math.PI/2,0);D.scale.setScalar(1);D.position.set(-8,2,0);D.userData.pr.position.set(0,1,.1)}
 if(!cas)$('elu').classList.add('hide');const rh={throne:'Tap the throne for a royal decree 👑',ball:'Tap anywhere to start a dance party 💃',bed:'Tap the dragon or bed to sleep 💤',garden:'Tap the apple tree to harvest 🍎'}[m];$('hint').classList.toggle('hide',m!='home'&&!rh);$('hint').textContent=rh||HINT[tool];
 $('dock').innerHTML=dock(m)}

menu();requestAnimationFrame(loop);
