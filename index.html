
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7046b8">
<title>Princess Masa and the Dragon of Crown Jewel</title>
<style>
:root{--purple:#7548b8;--pink:#ffb8d8;--gold:#ffe59b;--ink:#432c5b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,sans-serif;background:#a8eaff;color:var(--ink);touch-action:manipulation}
button{font:inherit;font-weight:800;border:2px solid white;border-radius:14px;padding:10px 12px;background:white;color:var(--ink);box-shadow:0 3px 0 #38204b1c;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button:disabled{opacity:.45}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;z-index:3;top:env(safe-area-inset-top,0px);left:0;right:0;padding:7px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
.card{background:#ffffffed;border:2px solid white;border-radius:14px;padding:7px 10px;box-shadow:0 3px 12px #39245020}
#brand{font-size:clamp(12px,3vw,19px);font-weight:1000;color:var(--purple)}
#stats{font-size:11px;font-weight:900;line-height:1.7}
#worldLabel{font-size:clamp(10px,2.8vw,14px);font-weight:900;text-align:right}
#modeLabel{font-size:10px;text-align:right;font-weight:800}
#status{position:fixed;z-index:3;top:72px;left:50%;transform:translateX(-50%);width:max-content;max-width:94vw;text-align:center;padding:8px 12px;background:#fff9e9;border:2px solid white;border-radius:14px;font-size:12px;font-weight:850;box-shadow:0 3px 12px #39245020;pointer-events:none}
#nav{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:5px;flex-wrap:wrap;background:linear-gradient(transparent,#3020433d)}
#nav button{font-size:11px;padding:9px 10px;border-radius:12px}
.purple{background:var(--purple);color:white}
.pink{background:#ffcae1}
.gold{background:var(--gold)}
#careButtons,#activityButtons{position:fixed;z-index:5;left:5px;right:5px;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;gap:5px;flex-wrap:wrap}
#careButtons button,#activityButtons button{font-size:11px;padding:9px 10px}
#flightButtons{position:fixed;z-index:5;left:7px;right:7px;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;pointer-events:none}
#flightButtons button{pointer-events:auto;width:53px;height:53px;padding:2px;font-size:21px;border-radius:17px;background:#ffffffed;touch-action:none}
#flightButtons .cluster{display:flex;gap:6px}
#tip{position:fixed;z-index:3;left:50%;bottom:calc(142px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ffffffdf;border-radius:12px;padding:6px 10px;font-size:10px;font-weight:850;white-space:nowrap;pointer-events:none;max-width:96vw}
#dialog{position:fixed;z-index:10;inset:0;background:#251539aa;display:none;align-items:center;justify-content:center;padding:14px}
#dialog.open{display:flex}
#dialogBox{width:min(600px,100%);max-height:82dvh;overflow-y:auto;background:#fff8f0;border:4px solid white;border-radius:22px;padding:16px;box-shadow:0 12px 50px #150b25aa}
#dialogBox h2{margin:0 0 7px;font-size:22px;color:var(--purple)}
#dialogDescription{font-size:13px;line-height:1.45}
#options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.option{background:white;border:2px solid #eadcfb;border-radius:14px;padding:10px;text-align:center}
.option strong{display:block;font-size:13px}
.option p{font-size:11px;margin:6px 0 9px}
.option button{font-size:11px;padding:8px}
#dialogFooter{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}
#toast{position:fixed;z-index:20;left:50%;bottom:calc(145px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;max-width:90vw;background:#392450;color:white;border-radius:14px;padding:10px 14px;font-weight:900;font-size:12px;text-align:center}
@media(max-width:400px){
 #nav{gap:4px}
 #nav button{font-size:10px;padding:8px 7px}
 #status{top:67px;font-size:10px}
 #careButtons,#activityButtons{bottom:calc(102px + env(safe-area-inset-bottom,0px))}
 #flightButtons{bottom:calc(97px + env(safe-area-inset-bottom,0px))}
 #flightButtons button{width:47px;height:48px}
}
</style>
</head>
<body>
<canvas id="game" aria-label="Princess Masa fantasy adventure game"></canvas>

<div id="top">
 <div class="card">
  <div id="brand">👑 CROWN JEWEL</div>
  <div id="stats">🪙 0 · ❤️ 7/7</div>
 </div>
 <div class="card">
  <div id="worldLabel">🏰 Castle Gardens</div>
  <div id="modeLabel">Royal Castle</div>
 </div>
</div>

<div id="status" role="status">Elu: Welcome home, Princess Masa!</div>
<div id="tip">Explore the castle with Elu!</div>

<div id="careButtons">
 <button class="pink" id="feed">🥕 Feed</button>
 <button class="pink" id="wash">🫧 Wash</button>
 <button class="pink" id="pet">💗 Pet</button>
 <button class="pink" id="hug">🤗 Hug</button>
 <button class="gold" id="heal">💚 Heal</button>
</div>

<div id="activityButtons">
 <button class="pink" id="tea">🫖 Tea party</button>
 <button class="pink" id="dance">💃 Dance party</button>
 <button class="pink" id="garden">🌱 Garden</button>
 <button class="gold" id="harvest">🧺 Harvest</button>
</div>

<div id="flightButtons">
 <div class="cluster">
  <button id="backward" aria-label="Fly backward">⬅️</button>
  <button id="up" aria-label="Fly up">⬆️</button>
  <button id="down" aria-label="Fly down">⬇️</button>
 </div>
 <div class="cluster">
  <button id="boost" aria-label="Fly faster">⚡</button>
  <button id="forward" aria-label="Fly forward">➡️</button>
 </div>
</div>

<div id="nav">
 <button id="castleTab" class="purple">🏰 Castle</button>
 <button id="flyTab">🐉 Fly</button>
 <button id="worldTab">🌎 Worlds</button>
 <button id="styleTab">👗 Style</button>
 <button id="gardenTab">🌷 Garden</button>
 <button id="missionTab">⭐ Missions</button>
 <button id="eluTab">💬 Elu</button>
</div>

<div id="dialog">
 <div id="dialogBox">
  <h2 id="dialogTitle">Welcome!</h2>
  <p id="dialogDescription"></p>
  <div id="options"></div>
  <div id="dialogFooter"></div>
 </div>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
(function(){
const $=id=>document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d");
if(!ctx){$("status").textContent="Please open this game in Safari or another modern browser.";return;}

const worlds=[
 {name:"Castle Gardens",emoji:"🏰",cost:0,sky:"#91e4ff",far:"#d7f5ff",ground:"#8bd99a",hazard:"🌳"},
 {name:"Candy Cloud Kingdom",emoji:"🍬",cost:100,sky:"#ffb9e5",far:"#e8d4ff",ground:"#ffb4df",hazard:"🍭"},
 {name:"Crystal Ice Mountains",emoji:"❄️",cost:220,sky:"#a3eeff",far:"#9bc5f4",ground:"#b9edfa",hazard:"💎"},
 {name:"Enchanted Forest",emoji:"🌲",cost:350,sky:"#a4e7bb",far:"#c4f1c6",ground:"#63c67c",hazard:"🌲"},
 {name:"Starry Dragon Realm",emoji:"🌌",cost:500,sky:"#302657",far:"#7763a9",ground:"#6752a1",hazard:"☄️"},
 {name:"Rainbow Sky Palace",emoji:"🌈",cost:750,sky:"#ffd4a7",far:"#f0d5ff",ground:"#a2e7d5",hazard:"🌈"}
];

const defaultState={
 coins:0,lives:7,world:0,unlocked:[0],
 dragon:"#a16ee8",wings:"#ff9dce",princess:"#ff83b9",
 accessory:0,outfit:0,
 care:{hunger:65,clean:80,happy:80,health:100},
 totalCoins:0,best:0,completed:[],
 garden:{plots:[null,null,null,null,null,null],harvests:0,plants:0}
};
let old={};
try{old=JSON.parse(localStorage.getItem("crownJewelSave")||"{}")||{};}catch(e){}
const state={...defaultState,...old};
state.care={...defaultState.care,...(old.care||{})};
state.garden={...defaultState.garden,...(old.garden||{})};
state.garden.plots=Array.isArray(state.garden.plots)?state.garden.plots.slice(0,6):defaultState.garden.plots.slice();
while(state.garden.plots.length<6)state.garden.plots.push(null);
state.unlocked=Array.isArray(state.unlocked)?[...new Set([0,...state.unlocked])].filter(i=>Number.isInteger(i)&&i>=0&&i<worlds.length):[0];
state.completed=Array.isArray(state.completed)?state.completed:[];
state.coins=Math.max(0,Number(state.coins)||0);
state.lives=Math.max(0,Math.min(7,Number(state.lives??7)));
state.world=state.unlocked.includes(state.world)?state.world:0;

const plants=[
 {name:"Sunflower",emoji:"🌻",seed:5,grow:30,harvest:12,food:5},
 {name:"Strawberry",emoji:"🍓",seed:8,grow:40,harvest:18,food:12},
 {name:"Carrot",emoji:"🥕",seed:4,grow:25,harvest:10,food:18},
 {name:"Rose",emoji:"🌹",seed:10,grow:45,harvest:22,food:0},
 {name:"Bluebell",emoji:"🪻",seed:7,grow:35,harvest:15,food:0},
 {name:"Pumpkin",emoji:"🎃",seed:12,grow:60,harvest:30,food:10}
];

let W=innerWidth,H=innerHeight,DPR=1;
let mode="castle",last=0,frame=0,saveClock=0;
let action=null,princess={walk:0},dragon={wing:0};
let obstacles=[],coins=[],particles=[];
let flight={x:.22,y:.48,worldX:0,speed:0,boost:0,invulnerable:0,spawn:1};
let mission={type:"coins",target:8,progress:0};
let toastTime=0,partyTime=0,partyType="";
let gardenSelection=0;

function save(){try{localStorage.setItem("crownJewelSave",JSON.stringify(state));}catch(e){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(a,b){return a+Math.random()*(b-a);}
function say(t){$("status").textContent=t;}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";toastTime=2.5;}
function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(W*DPR));canvas.height=Math.max(1,Math.round(H*DPR));
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);resize();

function oval(x,y,rx,ry,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);ctx.fill();
}
function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
 ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
 ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();
}
function path(points,color,width){
 ctx.strokeStyle=color;ctx.lineWidth=width||3;ctx.lineCap="round";ctx.lineJoin="round";
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
}
function label(t,x,y,size,color){
 ctx.font="900 "+size+"px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.lineWidth=2;ctx.strokeStyle="#563a6c55";ctx.strokeText(t,x,y);
 ctx.fillStyle=color||"#fff";ctx.fillText(t,x,y);
}
function star(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;
 if(i===0)ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);else ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
 ctx.closePath();ctx.fill();
}
function heart(x,y,s,color){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color||"#ff6fa7";
 ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-25,-5,-14,-20,0,-9);ctx.bezierCurveTo(14,-20,25,-5,0,10);ctx.fill();ctx.restore();
}
function cloud(x,y,s){
 ctx.fillStyle="#ffffffdf";ctx.beginPath();
 ctx.ellipse(x,y,35*s,14*s,0,0,Math.PI*2);ctx.ellipse(x-18*s,y-7*s,19*s,17*s,0,0,Math.PI*2);
 ctx.ellipse(x+3*s,y-13*s,22*s,21*s,0,0,Math.PI*2);ctx.ellipse(x+25*s,y-4*s,18*s,14*s,0,0,Math.PI*2);ctx.fill();
}
function lighten(hex){
 const n=parseInt(hex.slice(1),16);if(!Number.isFinite(n))return "#e6d4ff";
 return "rgb("+Math.min(255,((n>>16)&255)+38)+","+Math.min(255,((n>>8)&255)+38)+","+Math.min(255,(n&255)+38)+")";
}

function drawCastle(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 oval(110,180,125,12,"#467e7240");
 rounded(15,60,190,110,5,"#fff0dd");
 for(let yy=82;yy<164;yy+=21)path([[18,yy],[202,yy]],"#e9bca8",1.5);
 for(const tx of [0,157]){
  rounded(tx,15,48,155,4,"#ffe0cf");rounded(tx-5,5,58,16,3,"#aa83db");
  ctx.fillStyle="#8863bd";ctx.beginPath();ctx.moveTo(tx-5,5);ctx.lineTo(tx+24,-24);ctx.lineTo(tx+53,5);ctx.closePath();ctx.fill();
  rounded(tx+13,32,21,29,10,"#77d7ff");path([[tx+23,33],[tx+23,59]],"#fff",2);
 }
 ctx.fillStyle="#ad83df";ctx.beginPath();ctx.moveTo(64,60);ctx.lineTo(110,12);ctx.lineTo(156,60);ctx.closePath();ctx.fill();
 rounded(85,112,48,58,23,"#8455a0");
 for(const wx of [42,154]){
  rounded(wx,91,23,33,11,"#70d4ff");path([[wx+11,93],[wx+11,122]],"#fff",2);path([[wx+2,107],[wx+21,107]],"#fff",2);
 }
 label("CROWN JEWEL",110,197,13,"#fff");ctx.restore();
}

function drawDragon(x,y,s,pose){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 const c=state.dragon,w=state.wings,flap=Math.sin(dragon.wing)*.45;
 path([[28,5],[53,14],[73,4]],c,12);oval(74,4,7,6,c);
 for(const lx of [-20,20]){
  rounded(lx-7,13,14,24,6,c);
  for(let i=0;i<3;i++)oval(lx-8+i*6,36,3,3,"#ffe5a0");
 }
 ctx.save();ctx.translate(-7,-7);ctx.rotate(-.35+flap);ctx.fillStyle=w;
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-8,-49);ctx.lineTo(-42,-64);ctx.lineTo(-38,-34);ctx.lineTo(-59,-42);ctx.lineTo(-35,7);ctx.closePath();ctx.fill();ctx.strokeStyle="#fff9";ctx.lineWidth=2;ctx.stroke();ctx.restore();
 oval(0,0,39,27,c);oval(10,8,23,16,lighten(c));path([[19,-7],[30,-21]],c,19);
 oval(35,-25,23,21,c);oval(49,-18,17,11,lighten(c));
 ctx.fillStyle="#ffe5a0";ctx.beginPath();ctx.moveTo(23,-39);ctx.lineTo(20,-54);ctx.lineTo(35,-42);ctx.fill();
 ctx.beginPath();ctx.moveTo(39,-41);ctx.lineTo(47,-54);ctx.lineTo(49,-37);ctx.fill();
 oval(39,-29,7,8,"#fff");oval(41,-28,3.5,5,"#35234d");oval(42,-30,1.4,1.5,"#fff");
 oval(51,-21,1.8,2,"#4a315e");oval(59,-21,1.8,2,"#4a315e");
 oval(48,-11,6,3,"#ff9dbb");path([[45,-9],[50,-6],[55,-9]],"#543250",1.8);
 ctx.save();ctx.translate(-5,-5);ctx.rotate(.15-flap);ctx.fillStyle=w;
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-5,-35);ctx.lineTo(18,-26);ctx.lineTo(34,-40);ctx.lineTo(34,0);ctx.closePath();ctx.fill();ctx.strokeStyle="#fff9";ctx.lineWidth=2;ctx.stroke();ctx.restore();
 for(let i=0;i<3;i++)oval(-2+i*9,9+i*2,3,2,"#fff8");
 if(state.accessory===1){oval(35,-48,12,6,"#ffd66b");star(35,-51,7,"#fff4b0");}
 if(state.accessory===2){path([[23,-42],[36,-51],[49,-42]],"#ffe49a",4);star(36,-50,5,"#fff");}
 if(state.accessory===3){oval(31,-49,6,6,"#ff9bc2");oval(42,-49,6,6,"#ff9bc2");oval(36,-49,4,4,"#ffdeef");}
 if(pose==="hug")heart(0,-58,.8);
 ctx.restore();
}

function drawPrincess(x,y,s,walking){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 const swing=walking?Math.sin(princess.walk*10)*.6:0;
 oval(0,37,20,5,"#34234b25");
 oval(0,-25,16,19,"#653a53");oval(-13,-12,5,17,"#653a53");
 ctx.fillStyle=state.princess;ctx.beginPath();ctx.moveTo(-9,-11);ctx.lineTo(-17,23);ctx.lineTo(17,23);ctx.lineTo(9,-11);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff0f7";ctx.beginPath();ctx.moveTo(-7,-8);ctx.lineTo(0,5);ctx.lineTo(7,-8);ctx.closePath();ctx.fill();
 /* Princess's name is physically written on the front of her dress. */
 ctx.save();ctx.rotate(-.02);ctx.font="900 7px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.lineWidth=1.5;ctx.strokeStyle="#ffffff";ctx.strokeText("Masa",0,10);ctx.fillStyle="#713f89";ctx.fillText("Masa",0,10);ctx.restore();
 path([[-8,-5],[-16+swing*5,7]],"#f5c5a5",6);path([[8,-5],[16-swing*5,7]],"#f5c5a5",6);
 path([[-6,21],[-8+swing*4,34]],"#f5c5a5",6);path([[6,21],[8-swing*4,34]],"#f5c5a5",6);
 oval(-10,36,6,3,"#8b60bd");oval(10,36,6,3,"#8b60bd");
 oval(0,-17,12,14,"#ffdabe");ctx.fillStyle="#653a53";ctx.beginPath();ctx.arc(0,-23,12,Math.PI,Math.PI*2);ctx.lineTo(10,-17);ctx.quadraticCurveTo(4,-24,-2,-18);ctx.lineTo(-10,-16);ctx.closePath();ctx.fill();
 oval(-4,-17,1.7,2.8,"#3b284c");oval(4,-17,1.7,2.8,"#3b284c");path([[-3,-10],[0,-8],[3,-10]],"#b35c75",1.5);
 ctx.fillStyle="#ffd66b";ctx.beginPath();ctx.moveTo(-10,-29);ctx.lineTo(-8,-39);ctx.lineTo(-2,-33);ctx.lineTo(3,-41);ctx.lineTo(7,-32);ctx.lineTo(11,-36);ctx.lineTo(9,-28);ctx.closePath();ctx.fill();
 if(state.outfit===1)oval(12,-23,5,5,"#ff8db8");
 if(state.outfit===2)path([[-12,-28],[0,-34],[12,-28]],"#85dfff",3);
 if(state.outfit===3)oval(0,-32,5,4,"#9b78ed");
 ctx.restore();
}

/* Elu is an animated, visible character, not just a menu. */
function drawElu(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 const bob=Math.sin(frame*.06)*2;
 oval(0,34,17,4,"#34234b25");
 rounded(-10,-3,20,35,7,"#4c9ac8");
 ctx.fillStyle="#fff0d8";ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(0,10);ctx.lineTo(10,0);ctx.closePath();ctx.fill();
 path([[-9,2],[-17,13]],"#f0c49e",5);path([[9,2],[17,13]],"#f0c49e",5);
 path([[-5,29],[-7,35]],"#553c72",5);path([[5,29],[7,35]],"#553c72",5);
 oval(0,-15+bob,12,13,"#f5cda9");oval(0,-26+bob,12,7,"#49314e");
 oval(-4,-15+bob,1.5,2.3,"#3b284c");oval(4,-15+bob,1.5,2.3,"#3b284c");
 path([[-2,-9+bob],[0,-8+bob],[3,-9+bob]],"#a65b6c",1.5);
 ctx.fillStyle="#ffd76d";ctx.beginPath();ctx.moveTo(-9,-21+bob);ctx.lineTo(0,-29+bob);ctx.lineTo(9,-21+bob);ctx.closePath();ctx.fill();
 label("ELU",0,47,10,"#fff");ctx.restore();
}

function drawBackground(){
 const world=worlds[state.world],g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,world.sky);g.addColorStop(1,world.far);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(state.world===4){for(let i=0;i<35;i++)star((i*137+33)%W,(i*79+20)%(H*.8),2+(i%3),"#fff1b7");}
 else for(let i=0;i<5;i++)cloud(((i*211+frame*.12)%(W+130))-55,H*(.14+(i%3)*.13),.65+(i%3)*.15);
 ctx.fillStyle=world.ground;ctx.beginPath();ctx.moveTo(0,H*.78);
 for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*(.76+Math.sin(x*.009+frame*.001)*.025));
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
}

function drawStats(){
 const x=W*.025,y=H*.245,bw=Math.min(W*.29,145);
 [
  ["🍎 HUNGER",100-state.care.hunger,"#ffad7b"],
  ["🫧 CLEAN",state.care.clean,"#6fd8f8"],
  ["💖 HAPPY",state.care.happy,"#ff80b5"],
  ["💚 HEALTH",state.care.health,"#71d794"]
 ].forEach((b,i)=>{
  const yy=y+i*34;rounded(x,yy,bw,29,9,"#ffffffdf");

function addParticles(x,y,color,n){
 for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-90,90),vy:rand(-130,20),life:rand(.4,.9),color,size:rand(2,5)});
}
function drawParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt;
  if(p.life<=0){particles.splice(i,1);continue;}
  ctx.globalAlpha=clamp(p.life,0,1);oval(p.x,p.y,p.size,p.size,p.color);ctx.globalAlpha=1;
 }
}

function finishCare(kind){

}

function plantSeed(index,type){

 state.coins-=p.seed;state.garden.plots[index]={type,age:0,water:0};

function harvestGarden(){
 let count=0,reward=0,food=0;
 state.garden.plots.forEach((p,i)=>{
  if(!p)return;
  const plant=plants[p.type];
  if(p.age>=plant.grow){
   count++;reward+=plant.harvest;food+=plant.food;state.garden.plots[i]=null;
  }
 });
 if(!count){toast("Not ready yet! Water your plants and let them grow.");return;}
 state.coins+=reward;state.totalCoins+=reward;state.garden.harvests+=count;
 state.care.hunger=clamp(state.care.hunger+food,0,100);
 save();updateHUD();toast("Harvested "+count+" plants! Earned "+reward+" coins!");
 say("Elu: A beautiful harvest! I saved your produce for the dragon and the royal kitchen.");
}

function setMotion(direction){
 if(mode!=="flight")return;
 if(direction==="forward")flight.speed=1;
 if(direction==="backward")flight.speed=-1;
 if(direction==="up")flight.vy=-1;
 if(direction==="down")flight.vy=1;
 if(direction==="boost")flight.boost=1.5;
}
flight.vy=0;
function bindHold(id,direction){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(err){}
  setMotion(direction);
 });
 const stop=()=>{
  if(direction==="up"||direction==="down")flight.vy=0;
  if(direction==="forward"||direction==="backward")flight.speed=0;
 };
 el.addEventListener("pointerup",stop);
 el.addEventListener("pointercancel",stop);
 el.addEventListener("lostpointercapture",stop);
}
bindHold("forward","forward");bindHold("backward","backward");
bindHold("up","up");bindHold("down","down");
$("boost").addEventListener("pointerdown",e=>{e.preventDefault();setMotion("boost");});

window.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","w","W","s","S","a","A","d","D"].includes(e.key))e.preventDefault();
 if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")setMotion("up");
 if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")setMotion("down");
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")setMotion("backward");
 if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")setMotion("forward");
 if(e.key===" "||e.key==="Shift")setMotion("boost");
});
window.addEventListener("keyup",e=>{
 if(["ArrowUp","ArrowDown","w","W","s","S"].includes(e.key))flight.vy=0;
 if(["ArrowLeft","ArrowRight","a","A","d","D"].includes(e.key))flight.speed=0;
});

canvas.addEventListener("pointerdown",e=>{
 if(mode==="garden"){
  const y=H*.72;
  if(e.clientY>y-45&&e.clientY<y+65){
   const i=Math.floor((e.clientX-W*.12)/(W*.76/6));
   if(i>=0&&i<6)openPlanting(i);
  }
 }else if(mode==="flight"){
  // Tap to steer vertically; left/right movement remains available on dedicated buttons.
  flight.y=clamp(e.clientY/H,.12,.84);
 }
});

function loseLife(){
 if(flight.invulnerable>0)return;
 state.lives=Math.max(0,state.lives-1);state.care.health=Math.max(0,state.care.health-12);
 flight.invulnerable=1.5;addParticles(W*flight.x,H*flight.y,"#ff94b7",12);
 toast("Ouch! "+state.lives+" flying lives remaining!");
 if(state.lives===0){save();setMode("care");say("Elu: Back to the castle! Let's nurse your dragon to health.");}
}
function completeMission(){
 const key=state.world+":"+mission.type+":"+mission.target;
 if(state.completed.includes(key))return;
 state.completed.push(key);state.coins+=25;state.totalCoins+=25;
 state.best=Math.max(state.best,Math.floor(flight.worldX));
 toast("⭐ Mission complete! +25 coins!");say("Elu: Magnificent flying, Princess Masa!");save();updateHUD();
}
function spawnObject(){
 const y=rand(H*.18,H*.79);
 if(Math.random()<.58)obstacles.push({x:W+55,y,emoji:worlds[state.world].hazard,size:rand(35,54),hit:false});
 else coins.push({x:W+45,y,kind:Math.random()<.12?"star":"coin"});
}
function updateFlight(dt){
 flight.invulnerable=Math.max(0,flight.invulnerable-dt);
 flight.boost=Math.max(0,flight.boost-dt);
 const dir=flight.speed;
 const speed=(dir===0?115:dir*240)*(flight.boost>0?1.7:1);
 flight.worldX+=speed*dt;
 flight.y=clamp(flight.y+flight.vy*dt*.75,.12,.84);
 const scroll=speed;
 flight.spawn-=dt;
 if(flight.spawn<=0){spawnObject();flight.spawn=rand(.7,1.1);}
 for(let i=obstacles.length-1;i>=0;i--){
  const o=obstacles[i];
  o.x-=scroll*dt;
  if(o.x<-90){obstacles.splice(i,1);continue;}
  if(Math.hypot(o.x-W*flight.x,o.y-H*flight.y)<o.size*.42+22&&!o.hit){
   o.hit=true;loseLife();if(mode!=="flight")return;
  }else if(!o.hit&&o.x<W*flight.x){
   o.hit=true;
   if(mission.type==="dodge"){mission.progress++;if(mission.progress>=mission.target)completeMission();}
  }
 }
 for(let i=coins.length-1;i>=0;i--){
  const c=coins[i];c.x-=scroll*dt;
  if(c.x<-50){coins.splice(i,1);continue;}
  if(Math.hypot(c.x-W*flight.x,c.y-H*flight.y)<32){
   const reward=c.kind==="star"?10:2;state.coins+=reward;state.totalCoins+=reward;
   addParticles(c.x,c.y,"#ffe477",8);coins.splice(i,1);
   if(mission.type==="coins"){mission.progress++;if(mission.progress>=mission.target)completeMission();}
   updateHUD();
  }
 }
 if(mission.type==="distance"){
  mission.progress=Math.min(mission.target,Math.floor(Math.abs(flight.worldX)/350));
  if(mission.progress>=mission.target)completeMission();
 }
}

function update(dt){
 frame+=dt*60;dragon.wing+=dt*8;saveClock+=dt;
 if(toastTime>0){toastTime-=dt;if(toastTime<=0)$("toast").style.display="none";}
 if(mode==="care"&&action){
  action.time+=dt;princess.walk+=dt;
  if(action.phase==="walk"&&action.time>=1.1)action.phase="act";
  else if(action.phase==="act"&&action.time>=3)finishCare(action.kind);
 }
 if(mode==="care"&&!action){
  state.care.hunger=Math.max(0,state.care.hunger-dt*.10);
  state.care.clean=Math.max(0,state.care.clean-dt*.055);
  state.care.happy=Math.max(0,state.care.happy-dt*.025);
  if(state.care.hunger<8)state.care.health=Math.max(0,state.care.health-dt*.08);
  if(state.care.clean<5)state.care.health=Math.max(0,state.care.health-dt*.04);
 }
 if(mode==="garden"){
  state.garden.plots.forEach(p=>{if(p)p.age=Math.min(plants[p.type].grow,p.age+dt);});
 }
 if(mode==="tea"||mode==="dance")partyTime+=dt;
 if(mode==="flight")updateFlight(dt);
 if(saveClock>5){save();saveClock=0;}
}

function draw(){
 ctx.clearRect(0,0,W,H);drawBackground();
 if(mode==="care")drawCare();
 else if(mode==="flight")drawFlight();
 else if(mode==="garden")drawGardenScene();
 else drawCastleRoom();
 drawParticles(0);
}
function loop(now){
 const dt=last?Math.min(.04,(now-last)/1000):0;last=now;
 update(dt);draw();requestAnimationFrame(loop);
}

window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});

setMode("castle");
updateHUD();
say("Elu: Welcome to Crown Jewel, Princess Masa! I'm here to help with everything.");
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
