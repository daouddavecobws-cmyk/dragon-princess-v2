
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7046b8">
<title>Princess Masa & the Dragon of Crown Jewel</title>
<style>
:root{--purple:#7046b8;--pink:#ff7eb6;--gold:#ffd66b;--ink:#382454}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#a7e8ff;touch-action:manipulation}
button,select{font:inherit}
button{border:0;border-radius:14px;padding:10px 14px;background:white;color:var(--ink);font-weight:800;box-shadow:0 3px 0 #34214a25;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
button:disabled{opacity:.4}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;z-index:3;top:env(safe-area-inset-top,8px);left:0;right:0;padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#ffffffeb;border:2px solid #ffffffd9;border-radius:18px;padding:8px 12px;box-shadow:0 5px 18px #3d286425;backdrop-filter:blur(8px)}
#stats{font-size:13px;font-weight:900;line-height:1.7}
#title{font-size:clamp(13px,2.7vw,21px);font-weight:1000;color:#7046b8;text-shadow:0 1px white}
#message{position:fixed;z-index:4;top:88px;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;text-align:center;background:#fff8e8f5;border:2px solid white;border-radius:20px;padding:9px 15px;font-weight:800;font-size:13px;box-shadow:0 4px 15px #34214a25;pointer-events:none}
#nav{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;background:linear-gradient(transparent,#3d285425)}
#nav button{font-size:clamp(11px,2.8vw,14px);padding:10px 12px}
.primary{background:var(--purple);color:white}
.pink{background:#ffb5d5}
.gold{background:#ffe49b}
#controls{position:fixed;z-index:4;left:12px;right:12px;bottom:95px;display:none;justify-content:space-between;align-items:end;pointer-events:none}
#controls button{pointer-events:auto;background:#ffffffd9;width:64px;height:58px;font-size:23px;border-radius:20px;touch-action:none}
#rightControls{display:flex;gap:8px}
#rightControls button{width:58px}
#hint{position:fixed;z-index:2;left:50%;bottom:170px;transform:translateX(-50%);padding:7px 12px;background:#ffffffb8;border-radius:14px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
#modal{position:fixed;z-index:10;inset:0;background:#2b1849a8;display:none;align-items:center;justify-content:center;padding:18px}
#modal.show{display:flex}
#modalCard{width:min(560px,100%);max-height:82dvh;overflow:auto;background:#fff8f0;border:4px solid white;border-radius:26px;padding:20px;box-shadow:0 15px 60px #170c35aa}
#modalCard h2{margin:0 0 8px;color:var(--purple)}
#modalCard p{line-height:1.5}
#modalContent{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:15px 0}
.option{background:white;border:2px solid #eadcfb;border-radius:17px;padding:12px;text-align:center}
.option strong{display:block;margin-bottom:5px}
.option p{font-size:12px;margin:5px 0 10px}
#modalActions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;z-index:20;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#37224f;color:white;border-radius:16px;padding:11px 17px;font-weight:900;font-size:13px;display:none;text-align:center;max-width:90vw}
@media(max-width:520px){#top{padding:7px}#stats{font-size:11px;padding:6px 9px}#title{font-size:13px}#message{top:72px;font-size:11px;padding:7px 10px}#nav{gap:5px}#nav button{padding:9px 10px;border-radius:12px}#controls{bottom:95px}#hint{bottom:160px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Princess Masa and her dragon game"></canvas>

<div id="top">
  <div class="panel">
    <div id="title">👑 CROWN JEWEL</div>
    <div id="stats">🪙 0 · ❤️ 7/7</div>
  </div>
  <div class="panel" style="text-align:right">
    <div id="worldName" style="font-weight:1000">🏰 Castle Gardens</div>
    <div id="modeName" style="font-size:12px;font-weight:800">Dragon Care</div>
  </div>
</div>

<div id="message">Welcome home, Princess Masa! Your dragon missed you! 💖</div>

<div id="hint">✨ Take care of your dragon or explore the skies!</div>

<div id="controls">
  <button id="up" aria-label="Fly up">⬆️</button>
  <div id="rightControls">
    <button id="down" aria-label="Fly down">⬇️</button>
    <button id="boost" aria-label="Fly faster">⚡</button>
  </div>
</div>

<div id="nav">
  <button id="care" class="primary">🛁 Care</button>
  <button id="fly">🐉 Fly!</button>
  <button id="worlds">🌎 Worlds</button>
  <button id="custom">👗 Style</button>
  <button id="missions">⭐ Missions</button>
  <button id="help">💬 Elu</button>
</div>

<div id="modal">
  <div id="modalCard">
    <h2 id="modalTitle">Welcome!</h2>
    <p id="modalDesc"></p>
    <div id="modalContent"></div>
    <div id="modalActions">
      <button id="closeModal">Back</button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
(()=>{
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
if(!ctx){document.getElementById("message").textContent="This browser does not support canvas.";return;}

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);

const worlds=[
 {name:"Castle Gardens",emoji:"🏰",cost:0,sky:["#a2e9ff","#f6fbff"],ground:"#8bda91",hazard:"🌳",desc:"Your magical home. Learn to fly safely!"},
 {name:"Candy Cloud Kingdom",emoji:"🍬",cost:100,sky:["#ffc4ed","#b5c5ff"],ground:"#ffb7df",hazard:"🍭",desc:"Dodge giant lollipops and floating candy!"},
 {name:"Crystal Ice Mountains",emoji:"❄️",cost:220,sky:["#a8edff","#527ecb"],ground:"#a5e7fa",hazard:"💎",desc:"Glide through icy crystals and frozen peaks!"},
 {name:"Enchanted Forest",emoji:"🌲",cost:350,sky:["#9de5bb","#277e83"],ground:"#67c779",hazard:"🌲",desc:"Navigate ancient trees and enchanted mushrooms!"},
 {name:"Starry Dragon Realm",emoji:"🌌",cost:500,sky:["#33265f","#8b68c8"],ground:"#6550a4",hazard:"☄️",desc:"A magical space adventure full of comets!"},
 {name:"Rainbow Sky Palace",emoji:"🌈",cost:750,sky:["#ffe0ae","#d8c2ff"],ground:"#a9eddb",hazard:"🌈",desc:"The ultimate challenge above the rainbow!"}
];

const defaults={
 coins:0,world:0,unlocked:[0],lives:7,flights:0,highScore:0,
 care:{hunger:45,clean:65,happy:50,energy:100,health:100},
 dragonColor:"#a56df0",wingColor:"#ff9dcc",princessColor:"#ff80ba",
 accessory:0,outfit:0,completed:[],totalCoins:0
};
let saved={};
try{saved=JSON.parse(localStorage.getItem("crownJewelSave")||"{}")||{};}catch(e){}
const state={...defaults,...saved,
 care:{...defaults.care,...(saved.care||{})},
 unlocked:Array.isArray(saved.unlocked)?saved.unlocked:[0],
 completed:Array.isArray(saved.completed)?saved.completed:[]
};
state.unlocked=[...new Set([0,...state.unlocked])].filter(i=>Number.isInteger(i)&&i>=0&&i<worlds.length);
state.world=state.unlocked.includes(state.world)?state.world:0;
state.lives=clamp(Number(state.lives)||7,0,7);
state.coins=Math.max(0,Number(state.coins)||0);

let mode="care",last=0,elapsed=0,frame=0;
let toastTimer=0;
let particles=[];
let obstacles=[];
let pickups=[];
let spawnTimer=0;
let distance=0;
let flightCoins=0;
let boostTime=0;
let pointerDown=false;
let action=null;
let princess={x:.19,y:.69,scale:1,walk:0};
let dragon={x:.66,y:.68,wing:0,blink:0,tail:0};
let flight={x:.24,y:.5,vy:0,invincible:0};
let mission={type:"coins",target:10,progress:0};
let bestMessage="Welcome home, Princess Masa!";

function save(){
 try{localStorage.setItem("crownJewelSave",JSON.stringify(state));}
 catch(e){say("Your browser couldn't save progress. Check storage settings.");}
}
function say(text){
 $("message").textContent=text;
 bestMessage=text;
}
function toast(text){
 const el=$("toast");
 el.textContent=text;el.style.display="block";toastTimer=2.5;
}
function updateHUD(){
 $("stats").textContent=`🪙 ${state.coins} · ❤️ ${state.lives}/7 · 🐉 ${Math.round(state.care.health)}%`;
 $("worldName").textContent=worlds[state.world].emoji+" "+worlds[state.world].name;
 $("modeName").textContent=mode==="care"?"Dragon Care":mode==="flight"?"✈️ Flight Mission":"Crown Jewel";
 $("controls").style.display=mode==="flight"?"flex":"none";
 $("hint").textContent=mode==="flight"?"⬆️⬇️ Steer · ⚡ Boost · Avoid obstacles!":
 "✨ "+(mode==="care"?"Choose a care activity and watch Masa walk to her dragon!":"Explore your magical kingdom!");
 $("care").classList.toggle("primary",mode==="care");
 $("fly").classList.toggle("primary",mode==="flight");
}
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.floor(innerWidth*dpr));
 canvas.height=Math.max(1,Math.floor(innerHeight*dpr));
 canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function ellipse(x,y,rx,ry,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);ctx.fill();
}
function line(points,color,width=3){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
}
function text(t,x,y,size,color="#fff",align="center"){
 ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.textBaseline="middle";
 ctx.lineWidth=3;ctx.strokeStyle="#4a2c6570";ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);
}
function cloud(x,y,s=1){
 ctx.fillStyle="#ffffffcc";ctx.beginPath();
 ctx.ellipse(x,y,34*s,13*s,0,0,Math.PI*2);
 ctx.ellipse(x-19*s,y-8*s,17*s,16*s,0,0,Math.PI*2);
 ctx.ellipse(x+3*s,y-14*s,21*s,20*s,0,0,Math.PI*2);
 ctx.ellipse(x+23*s,y-4*s,19*s,14*s,0,0,Math.PI*2);ctx.fill();
}
function heart(x,y,s,color="#ff6f9f"){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;
 ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-21,-4,-12,-17,0,-7);ctx.bezierCurveTo(12,-17,21,-4,0,8);ctx.fill();ctx.restore();
}
function star(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
 ctx.closePath();ctx.fill();
}

function background(){
 const w=innerWidth,h=innerHeight,world=worlds[state.world];
 let g=ctx.createLinearGradient(0,0,0,h);
 g.addColorStop(0,world.sky[0]);g.addColorStop(1,world.sky[1]);
 ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 if(state.world===4){
   for(let i=0;i<65;i++)star((i*137+40)%w,(i*79+20)%(h*.8),2+(i%3), "#fff3c7");
 }else{
   for(let i=0;i<5;i++)cloud(((i*237+frame*.12)%(w+160))-70, h*(.14+(i%3)*.13),.6+(i%3)*.2);
 }
 // Faraway hills
 ctx.fillStyle=world.ground;
 ctx.beginPath();ctx.moveTo(0,h*.83);
 for(let x=0;x<=w+40;x+=40)ctx.lineTo(x,h*(.75+Math.sin(x*.009+frame*.001)*.035));
 ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
 if(mode==="care")drawCastle();
}
function drawCastle(){
 const w=innerWidth,h=innerHeight;
 const x=w*.09,y=h*.44,s=Math.min(w,h)/700;
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 // castle shadow
 ellipse(110,245,165,16,"#486f7440");
 // walls
 roundedRect(12,80,190,145,8,"#fff0df");
 // brick lines
 ctx.strokeStyle="#e7b9a5";ctx.lineWidth=2;
 for(let yy=103;yy<220;yy+=24){ctx.beginPath();ctx.moveTo(15,yy);ctx.lineTo(198,yy);ctx.stroke();}
 // towers
 for(const tx of [0,150]){
   roundedRect(tx,28,48,190,6,"#ffdfcf");
   roundedRect(tx-7,17,62,18,5,"#b88ae8");
   ctx.fillStyle="#8c66c3";ctx.beginPath();ctx.moveTo(tx-5,17);ctx.lineTo(tx+24,-12);ctx.lineTo(tx+53,17);ctx.fill();
   roundedRect(tx+14,52,20,31,10,"#8bd8ff");
 }
 roundedRect(75,122,45,103,24,"#8e5b9e");
 ellipse(97,125,22,9,"#8e5b9e");
 // windows
 for(const wx of [45,135]){
   roundedRect(wx,120,24,34,12,"#86d8ff");
   line([[wx+12,122],[wx+12,152]],"#fff",2);
   line([[wx+2,137],[wx+22,137]],"#fff",2);
 }
 text("CROWN JEWEL",102,253,14,"#fff");
 ctx.restore();
}

function drawDragon(x,y,s,fly=false){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 const c=state.dragonColor,wc=state.wingColor;
 // tail
 line([[35,8],[65,15],[84,4]],c,13);
 ellipse(83,4,8,7,c);
 // legs
 for(const lx of [-22,22]){
  roundedRect(lx-8,21,15,22,7,c);
  for(let i=0;i<3;i++)ellipse(lx-9+i*7,41,3,3,"#ffe3a7");
 }
 // far wing flaps
 const flap=Math.sin(dragon.wing)*.7;
 ctx.save();ctx.translate(-4,-8);ctx.rotate(-.3+flap);
 ctx.fillStyle=wc;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-8,-58,-49,-62);
 ctx.lineTo(-43,-28);ctx.lineTo(-66,-37);ctx.lineTo(-35,8);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff8";ctx.lineWidth=2;ctx.stroke();ctx.restore();
 // body
 ellipse(0,0,42,28,c);
 ellipse(11,9,25,16,lighten(c));
 // neck and head
 line([[22,-9],[35,-22]],c,20);
 ellipse(38,-28,23,20,c);
 // snout
 ellipse(53,-21,17,11,lighten(c));
 // nostrils
 ellipse(60,-24,2,2,"#533d69");ellipse(53,-26,2,2,"#533d69");
 // ears/horns
 ctx.fillStyle="#ffe3a7";
 ctx.beginPath();ctx.moveTo(27,-40);ctx.lineTo(22,-56);ctx.lineTo(39,-43);ctx.fill();
 ctx.beginPath();ctx.moveTo(43,-43);ctx.lineTo(47,-57);ctx.lineTo(53,-39);ctx.fill();
 // eyes
 ellipse(42,-32,7,8,"white");ellipse(44,-31,3.8,5,"#382454");
 ellipse(45,-33,1.4,1.7,"white");
 // blush
 ellipse(54,-13,6,3,"#ff9cb7");
 // smile
 line([[48,-12],[54,-9],[59,-12]],"#593452",2);
 // near wing
 ctx.save();ctx.translate(-2,-9);ctx.rotate(.2-flap);
 ctx.fillStyle=wc;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-5,-35);ctx.lineTo(21,-25);ctx.lineTo(39,-38);ctx.lineTo(34,0);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff9";ctx.lineWidth=2;ctx.stroke();ctx.restore();
 // decorative belly scales
 for(let i=0;i<3;i++)ellipse(0+i*9,8+i*2,3,2,"#fff6");
 // accessory
 if(state.accessory===1){ellipse(37,-48,13,6,"#ffd66b");star(37,-52,7,"#fff3a0");}
 if(state.accessory===2){line([[22,-44],[38,-52],[49,-44]],"#ffdf83",5);star(39,-51,5,"white");}
 if(state.accessory===3){ellipse(40,-51,14,7,"#ff91ba");ellipse(35,-52,4,3,"#ffcfdf");}
 ctx.restore();
}
function lighten(hex){
 try{let n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 r=Math.min(255,r+40);g=Math.min(255,g+40);b=Math.min(255,b+40);
 return `rgb(${r},${g},${b})`;}catch(e){return "#d7baff";}
}
function drawPrincess(x,y,s,walking=false){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 const c=state.princessColor;
 // shadow
 ellipse(0,38,21,5,"#3a28512a");
 // hair behind head
 ellipse(0,-26,16,20,"#633b52");
 // hair braid
 ellipse(-13,-14,5,17,"#633b52");
 // dress
 ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(-16,23);ctx.lineTo(17,23);ctx.lineTo(8,-10);ctx.closePath();ctx.fill();
 ctx.fillStyle="#ffe4f0";ctx.beginPath();ctx.moveTo(-7,-8);ctx.lineTo(0,5);ctx.lineTo(7,-8);ctx.fill();
 // arms animated
 const swing=walking?Math.sin(princess.walk*10)*.55:0;
 line([[-8,-5],[-17+swing*5,7]],"#f4bf9d",6);
 line([[8,-5],[17-swing*5,7]],"#f4bf9d",6);
 // legs
 line([[-6,21],[-8+(walking?swing*5:0),35]],"#f4bf9d",6);
 line([[6,21],[8-(walking?swing*5:0),35]],"#f4bf9d",6);
 ellipse(-9,36,6,3,"#8b5eb8");ellipse(9,36,6,3,"#8b5eb8");
 // face
 ellipse(0,-17,12,14,"#ffd9b9");
 // bangs
 ctx.fillStyle="#633b52";ctx.beginPath();ctx.arc(0,-23,12,Math.PI,Math.PI*2);ctx.lineTo(10,-18);ctx.quadraticCurveTo(3,-23,-3,-18);ctx.lineTo(-10,-16);ctx.closePath();ctx.fill();
 // eyes
 ellipse(-4,-17,1.7,2.8,"#493052");ellipse(4,-17,1.7,2.8,"#493052");
 ellipse(-3,-18,0.6,.8,"white");ellipse(5,-18,.6,.8,"white");
 // smile
 line([[-3,-10],[0,-8],[3,-10]],"#b85c71",1.5);
 // crown
 ctx.fillStyle="#ffd66b";ctx.beginPath();ctx.moveTo(-10,-30);ctx.lineTo(-8,-39);ctx.lineTo(-2,-33);ctx.lineTo(3,-41);ctx.lineTo(7,-32);ctx.lineTo(11,-36);ctx.lineTo(9,-28);ctx.closePath();ctx.fill();
 // hair decoration
 if(state.outfit===1){ellipse(12,-23,5,5,"#ff8cb9");}
 if(state.outfit===2){line([[-12,-28],[0,-34],[12,-28]],"#91dfff",3);}
 if(state.outfit===3){ellipse(0,-32,5,4,"#9a76ed");}
 ctx.restore();
}

function drawCare(){
 const w=innerWidth,h=innerHeight;
 // flowers
 for(let i=0;i<13;i++){
  const x=(i*97+31)%w,y=h*.84+(i%3)*10;
  line([[x,y+10],[x,y-2]],"#258b5a",2);
  for(let a=0;a<5;a++){let ang=a*Math.PI*2/5;ellipse(x+Math.cos(ang)*4,y-4+Math.sin(ang)*4,3,3,["#ff90ba","#ffe879","#fff","#bca5ff"][i%4]);}
 }
 // care station
 roundedRect(w*.38,h*.77,w*.51,h*.13,18,"#fff0d8");
 text("✨ DRAGON CARE STATION ✨",w*.635,h*.80,Math.min(17,w*.025),"#8759aa");
 // bath basin
 roundedRect(w*.51,h*.85,w*.20,h*.05,12,"#7fdfff");
 ellipse(w*.61,h*.85,w*.10,h*.025,"#b6f0ff");
 // dragon
 drawDragon(dragon.x*w,dragon.y*h,Math.min(w,h)/500);
 // princess approaches dragon during care
 drawPrincess(princess.x*w,princess.y*h,Math.min(w,h)/500,!!action);
 // action effect
 if(action){
  const x=dragon.x*w,y=dragon.y*h-55;
  if(action.kind==="wash"){
   for(let i=0;i<9;i++)ellipse(x+Math.sin(frame*.12+i)*28,y+Math.cos(frame*.09+i)*19,3+(i%3),4,"#a9eaff");
  }else if(action.kind==="feed"){
   text("🥕",x-36,y+12,22,"#fff");
   heart(x+26,y-22,.6);
  }else if(action.kind==="pet"){
   heart(x+25,y-45,.65);
   star(x-28,y-34,7,"#ffe879");
  }else if(action.kind==="hug"){
   heart(x,y-56,1.1);
   heart(x-30,y-35,.5);
   heart(x+30,y-35,.5);
  }
 }
 // status cards
 const y=h*.19;
 const bar=(x,label,val,color)=>{
  roundedRect(x,y,116,34,12,"#ffffffd9");
  text(label,x+8,y+10,10,"#68488b","left");
  roundedRect(x+8,y+19,100,7,4,"#eadcf4");
  roundedRect(x+8,y+19,100*clamp(val/100,0,1),7,4,color);
 };
 bar(w*.34,"🍎 HUNGER",100-state.care.hunger,"#ffb17b");
 bar(w*.34,"🫧 CLEAN",state.care.clean,"#70d9f8");
 bar(w*.34,"💖 HAPPINESS",state.care.happy,"#ff7eaf");
 bar(w*.34,"💚 HEALTH",state.care.health,"#78d89a");
}
function drawFlight(){
 const w=innerWidth,h=innerHeight;
 // parallax terrain
 ctx.fillStyle=worlds[state.world].ground;
 ctx.beginPath();ctx.moveTo(0,h);
 for(let x=0;x<=w+30;x+=30){
  const y=h*.94+Math.sin((x+distance*.35)*.018)*h*.035;
  ctx.lineTo(x,y);
 }
 ctx.lineTo(w,h);ctx.closePath();ctx.fill();
 // world scenery
 for(let i=0;i<7;i++){
  let x=((i*183-distance*.6)%(w+220)+w+220)%(w+220)-70;
  const y=h*(.18+(i%4)*.16);
  if(state.world===0){
   // floating castle towers
   roundedRect(x,y,36,75,5,"#fff0df");
   ctx.fillStyle="#aa8ae0";ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+18,y-28);ctx.lineTo(x+41,y);ctx.fill();
   roundedRect(x+10,y+16,14,22,7,"#9edfff");
  }else if(state.world===1){
   cloud(x,y,.8);text("🍭",x,y+10,32);
  }else if(state.world===2){text("💎",x,y,47);}
  else if(state.world===3){text("🌲",x,y+10,48);}
  else if(state.world===4){star(x,y,18,"#fff1a6");}
  else{text("🌈",x,y,50);}
 }
 // pickups
 for(const p of pickups){
  text(p.type==="coin"?"🪙":"⭐",p.x,p.y,26);
  if(p.type==="coin")star(p.x,p.y,3,"#fff4a1");
 }
 // obstacles
 for(const o of obstacles){
  text(o.emoji,o.x,o.y,o.size);
 }
 // dragon and rider
 const scale=Math.min(w,h)/500;
 drawDragon(flight.x*w,flight.y*h,scale,true);
 drawPrincess(flight.x*w-22*scale,flight.y*h+23*scale,scale,false);
 // boost trails
 if(boostTime>0){
  for(let i=0;i<5;i++)ellipse(flight.x*w-70*scale-i*12,flight.y*h+rand(-13,13),rand(5,12),3,"#fff4a0");
 }
 // mission banner
 roundedRect(w*.30,Math.max(90,h*.13),w*.40,35,14,"#ffffffd9");
 text(`⭐ ${mission.type==="coins"?"Collect coins":mission.type==="dodge"?"Dodge obstacles":"Fly the distance"}: ${mission.progress}/${mission.target}`,w*.5,Math.max(107,h*.13+17),Math.min(13,w*.022),"#6946a3");
}
function addParticles(x,y,color,n=8){
 for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-120,40),life:rand(.4,1),color,size:rand(2,6)});
}
function drawParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.life-=dt;
  if(p.life<=0){particles.splice(i,1);continue;}
  ctx.globalAlpha=clamp(p.life,0,1);ellipse(p.x,p.y,p.size,p.size,p.color);ctx.globalAlpha=1;
 }
}
function setMode(next){
 if(next==="flight"&&state.lives<=0){
  say("Your dragon needs healing! Visit the Care Station and restore its health. 💚");
  toast("🐉 Heal your dragon before flying again!");
  setMode("care");return;
 }
 mode=next;action=null;
 if(mode==="flight"){
  obstacles=[];pickups=[];spawnTimer=.6;distance=0;flightCoins=0;
  flight={x:.24,y:.48,vy:0,invincible:1.4};
  state.flights++;
  mission={type:["coins","dodge","distance"][state.flights%3],target:state.flights%3===0?300:state.flights%3===1?10:8,progress:0};
  say("Elu: Stay alert, Princess! Collect treasures and watch for obstacles!");
 }else if(mode==="care"){
  say("Elu: Welcome to the Care Station! Your dragon deserves all the love in the kingdom.");
 }
 updateHUD();
}
function startCare(kind){
 if(mode!=="care")setMode("care");
 if(action){toast("Masa is already caring for her dragon!");return;}
 if(state.care.health<=0&&kind!=="heal"){
  toast("Your dragon needs healing first!");return;
 }
 action={kind,phase:"walk",time:0,startX:princess.x};
 say(({feed:"Masa is bringing a delicious dragon snack! 🥕",wash:"Masa is preparing a bubbly dragon bath! 🫧",pet:"Masa is going to give her dragon some gentle pets! 💗",hug:"Masa is going to give her dragon the biggest hug! 🤗",heal:"Masa is caring for her dragon until it feels better! 💚"})[kind]||"Masa is caring for her dragon.");
}
function finishCare(kind){
 const c=state.care;
 if(kind==="feed"){c.hunger=clamp(c.hunger+38,0,100);c.energy=clamp(c.energy+8,0,100);c.health=clamp(c.health+6,0,100);}
 if(kind==="wash"){c.clean=clamp(c.clean+48,0,100);c.happy=clamp(c.happy+7,0,100);}
 if(kind==="pet"){c.happy=clamp(c.happy+25,0,100);c.health=clamp(c.health+3,0,100);}
 if(kind==="hug"){c.happy=clamp(c.happy+32,0,100);c.energy=clamp(c.energy+10,0,100);c.health=clamp(c.health+8,0,100);}
 if(kind==="heal"){
  c.health=100;c.energy=100;c.happy=clamp(c.happy+20,0,100);
  c.hunger=Math.max(c.hunger,75);c.clean=Math.max(c.clean,75);
  state.lives=7;
  toast("💚 Dragon fully healed! All 7 flying lives restored!");
  say("Elu: Wonderful! Your dragon is healthy again and ready to fly!");
 }else{
  state.coins+=5;state.totalCoins+=5;
  toast("💖 Care complete! +5 coins!");
  say(({feed:"Yum! Your dragon loved that snack! +5 coins!",wash:"Splish splash! A sparkling clean dragon! +5 coins!",pet:"Your dragon is purring with happiness! +5 coins!",hug:"The sweetest dragon hug ever! +5 coins!"})[kind]);
 }
 addParticles(dragon.x*innerWidth,dragon.y*innerHeight-45,kind==="wash"?"#83dfff":"#ffb3d7",16);
 action=null;save();updateHUD();
}
function startHeal(){
 if(state.care.health>=100&&state.lives===7){toast("Your dragon is already in perfect health!");return;}
 startCare("heal");
}
function updateCare(dt){
 if(!action){
  state.care.hunger=Math.max(0,state.care.hunger-dt*.10);
  state.care.clean=Math.max(0,state.care.clean-dt*.07);
  state.care.happy=Math.max(0,state.care.happy-dt*.045);
  if(state.care.hunger<10)state.care.health=Math.max(0,state.care.health-dt*.12);
  if(state.care.clean<8)state.care.health=Math.max(0,state.care.health-dt*.06);
  princess.x+=(.19-princess.x)*Math.min(1,dt*3);
  princess.y+=(.69-princess.y)*Math.min(1,dt*3);
 }else{
  action.time+=dt;princess.walk+=dt;
  if(action.phase==="walk"){
   princess.x+=(.49-princess.x)*Math.min(1,dt*2.8);
   princess.y+=(.67-princess.y)*Math.min(1,dt*2.8);
   if(Math.abs(princess.x-.49)<.012)action.phase="act";
  }else if(action.phase==="act"){
   if(action.time>(action.kind==="heal"?4:2.5))finishCare(action.kind);
  }
 }
}
function hit(a,b,margin=32){return Math.abs(a.x-b.x)<margin+a.size*.25&&Math.abs(a.y-b.y)<margin+a.size*.25;}
function spawnFlight(){
 const h=innerHeight,w=innerWidth;
 const y=rand(h*.20,h*.75);
 const world=worlds[state.world];
 if(Math.random()<.57){
  obstacles.push({x:w+60,y,emoji:world.hazard,size:rand(38,58),passed:false});
 }else{
  pickups.push({x:w+40,y:clamp(y+rand(-55,55),h*.16,h*.80),type:Math.random()<.12?"star":"coin"});
 }
}
function loseLife(){
 if(flight.invincible>0)return;
 state.lives=Math.max(0,state.lives-1);
 flight.invincible=1.7;
 state.care.health=Math.max(0,state.care.health-12);
 addParticles(flight.x*innerWidth,flight.y*innerHeight,"#ff9bba",15);
 toast(`💥 Ouch! ${state.lives} flying lives left!`);
 if(state.lives===0){
  say("Elu: We must return to Crown Jewel! Your dragon needs loving care before flying again.");
  setMode("care");save();return;
 }
}
function completeMission(){
 if(state.completed.includes(mission.type))return;
 state.completed.push(mission.type);
 state.coins+=25;state.totalCoins+=25;
 toast("⭐ Mission complete! +25 bonus coins!");
 say("Elu: Magnificent flying, Princess Masa! You've earned a mission bonus!");
 mission.progress=0;
 save();updateHUD();
}
function updateFlight(dt){
 distance+=dt*(boostTime>0?210:135);
 if(boostTime>0)boostTime=Math.max(0,boostTime-dt);
 flight.invincible=Math.max(0,flight.invincible-dt);
 const speed=boostTime>0?1.6:1;
 flight.y=clamp(flight.y+flight.vy*dt*speed,.12,.84);
 flight.vy*=Math.max(0,1-dt*3.2);
 spawnTimer-=dt;
 if(spawnTimer<=0){spawnFlight();spawnTimer=rand(.75,1.25)/(1+Math.min(distance/1800,.8));}
 const w=innerWidth,h=innerHeight,scale=Math.min(w,h)/500;
 for(let i=obstacles.length-1;i>=0;i--){
  const o=obstacles[i];o.x-=dt*(235+distance*.012)*speed;
  if(o.x<-100){obstacles.splice(i,1);continue;}
  const dx=o.x-flight.x*w,dy=o.y-flight.y*h;
  if(Math.hypot(dx,dy)<o.size*.45+24*scale){
   if(!o.passed){o.passed=true;loseLife();if(mode!=="flight")return;}
  }else if(!o.passed&&o.x<flight.x*w){
   o.passed=true;
   if(mission.type==="dodge"){mission.progress++;if(mission.progress>=mission.target)completeMission();}
  }
 }
 for(let i=pickups.length-1;i>=0;i--){
  const p=pickups[i];p.x-=dt*(235+distance*.012)*speed;
  if(p.x<-50){pickups.splice(i,1);continue;}
  if(Math.hypot(p.x-flight.x*w,p.y-flight.y*h)<34*scale){
   state.coins+=p.type==="star"?10:2;
   state.totalCoins+=p.type==="star"?10:2;
   flightCoins+=1;
   addParticles(p.x,p.y,"#ffe477",8);
   pickups.splice(i,1);
   if(mission.type==="coins"){mission.progress++;if(mission.progress>=mission.target)completeMission();}
   updateHUD();
  }
 }
 if(mission.type==="distance"){
  mission.progress=Math.min(mission.target,Math.floor(distance/100));
  if(mission.progress>=mission.target)completeMission();
 }
}
function update(dt){
 frame+=dt*60;elapsed+=dt;
 dragon.wing+=dt*9;dragon.tail+=dt*4;
 dragon.blink+=dt;
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$("toast").style.display="none";}
 if(mode==="care")updateCare(dt);
 if(mode==="flight")updateFlight(dt);
 if(Math.floor(elapsed)%4===0&&Math.random()<dt*.2)save();
}

function draw(){
 const w=innerWidth,h=innerHeight;
 ctx.clearRect(0,0,w,h);
 background();
 if(mode==="care")drawCare();
 else drawFlight();
 drawParticles(0);
}
function loop(now){
 const dt=Math.min(.04,Math.max(0,(now-last)/1000||0));
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

function openModal(title,desc,items,actions=[]){
 $("modalTitle").textContent=title;$("modalDesc").textContent=desc;
 const area=$("modalContent");area.innerHTML="";
 for(const item of items){
  const card=document.createElement("div");card.className="option";
  const strong=document.createElement("strong");strong.textContent=item.title;card.append(strong);
  const p=document.createElement("p");p.textContent=item.desc;card.append(p);
  const b=document.createElement("button");b.textContent=item.button||"Choose";
  if(item.disabled)b.disabled=true;
  b.addEventListener("click",()=>item.run());card.append(b);area.append(card);
 }
 const aa=$("modalActions");aa.innerHTML="";
 actions.forEach(a=>{const b=document.createElement("button");b.textContent=a.label;b.className=a.primary?"primary":"";b.addEventListener("click",a.run);aa.append(b);});
 const close=document.createElement("button");close.textContent="Close";close.addEventListener("click",closeModal);aa.append(close);
 $("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show");}
$("closeModal").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});

$("care").addEventListener("click",()=>setMode("care"));
$("fly").addEventListener("click",()=>{
 if(state.care.health<=0){startHeal();return;}
 setMode("flight");
});
$("worlds").addEventListener("click",()=>{
 openModal("🌎 Explore the Kingdom","Unlock magical worlds with the coins you collect while flying.",
 worlds.map((w,i)=>({
  title:w.emoji+" "+w.name,
  desc:(state.unlocked.includes(i)?"UNLOCKED · ":`🔒 ${w.cost} coins · `)+w.desc,
  button:state.unlocked.includes(i)?"Travel here":`Unlock ${w.cost} 🪙`,
  disabled:!state.unlocked.includes(i)&&state.coins<w.cost,
  run:()=>{
   if(!state.unlocked.includes(i)){
    if(state.coins<w.cost){toast("You need more coins!");return;}
    state.coins-=w.cost;state.unlocked.push(i);
    toast("🌟 New world unlocked!");
   }
   state.world=i;closeModal();setMode("care");save();updateHUD();
   say("Elu: Welcome to "+w.name+"! "+w.desc);
  }
 })));
});
$("custom").addEventListener("click",()=>{
 const dragonColors=["#a56df0","#67c6e8","#ff8eb4","#8bdc9a","#ffb54f","#6c7cff","#f5f1ff"];
 const wingColors=["#ff9dcc","#83e4ff","#ffdf83","#b6f7c5","#c7b4ff","#ffad83"];
 const princessColors=["#ff80ba","#8a7cff","#67c9e8","#f5a65c","#7acb96"];
 const accessories=["None","Golden Star Crown","Royal Tiara","Pink Bow"];
 const outfits=["Royal Pink","Flower Princess","Ice Princess","Lavender Royal"];
 const items=[
  {title:"🐉 Dragon Color",desc:"Current: "+state.dragonColor,button:"Change color",run:()=>{state.dragonColor=dragonColors[(dragonColors.indexOf(state.dragonColor)+1)%dragonColors.length];save();closeModal();$("custom").click();}},
  {title:"🪽 Wing Color",desc:"Current: "+state.wingColor,button:"Change wings",run:()=>{state.wingColor=wingColors[(wingColors.indexOf(state.wingColor)+1)%wingColors.length];save();closeModal();$("custom").click();}},
  {title:"👗 Princess Dress",desc:outfits[state.outfit],button:"Change dress",run:()=>{state.outfit=(state.outfit+1)%outfits.length;state.princessColor=princessColors[state.outfit%princessColors.length];save();closeModal();$("custom").click();}},
  {title:"👑 Dragon Accessory",desc:accessories[state.accessory],button:"Change accessory",run:()=>{state.accessory=(state.accessory+1)%accessories.length;save();closeModal();$("custom").click();}}
 ];
 openModal("✨ Royal Customization","Make Princess Masa and her dragon your own! Changes save automatically.",items);
});
$("missions").addEventListener("click",()=>{
 openModal("⭐ Royal Mission Board","Earn coins by flying safely, collecting treasure, and taking care of your dragon.",[
  {title:"🪙 Treasure Hunter",desc:"Collect coins during flight. Every coin brings new adventures closer.",button:"Start flying",run:()=>{closeModal();setMode("flight");}},
  {title:"🪽 Sky Explorer",desc:"Travel 800 meters in the air to complete a distance mission.",button:"Explore",run:()=>{closeModal();setMode("flight");}},
  {title:"💖 Dragon Care",desc:"Feed, wash, pet and hug your dragon. Each completed activity earns 5 coins.",button:"Care for dragon",run:()=>{closeModal();setMode("care");}},
  {title:"🏆 Personal Best",desc:`Best coins in one saved run: ${state.highScore}. Total coins collected: ${state.totalCoins}.`,button:"Wonderful!",run:closeModal}
 ]);
});
$("help").addEventListener("click",()=>{
 openModal("💬 Elu — Royal Concierge",
 "Hello, Princess Masa! I'm Elu, your always-helpful concierge. Here's my royal advice.",[
  {title:"🐉 Dragon Care",desc:"Visit Care and select Feed, Wash, Pet, or Hug. Masa walks over before the activity starts.",button:"Let's care!",run:()=>{closeModal();setMode("care");}},
  {title:"✈️ Flying",desc:"Use the up/down buttons, arrow keys, or W/S to steer. Collect coins and avoid obstacles. The boost button gives you a speed burst.",button:"Let's fly!",run:()=>{closeModal();setMode("flight");}},
  {title:"❤️ Seven Lives",desc:"You start with 7 lives. Collisions cost lives and damage your dragon. When you run out, visit the care station and heal your dragon to restore all 7.",button:"Understood!",run:closeModal}},
  {title:"🌎 New Worlds",desc:"Collect coins to unlock worlds. Each world has a different background and obstacle theme.",button:"Explore worlds",run:()=>{$("worlds").click();}}
 ]);
});

const careActions=[
 ["🥕 Feed","feed"],["🫧 Wash","wash"],["💗 Pet","pet"],["🤗 Hug","hug"],["💚 Heal","heal"]
];
for(const [label,kind] of careActions){
 const b=document.createElement("button");b.textContent=label;
 b.className=kind==="heal"?"gold":"pink";
 b.addEventListener("click",()=>kind==="heal"?startHeal():startCare(kind));
 $("nav").appendChild(b);
}
function moveUp(){if(mode==="flight")flight.vy=-1.5;}
function moveDown(){if(mode==="flight")flight.vy=1.5;}
function boost(){if(mode==="flight")boostTime=1.2;}
function bindHold(id,fn){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);fn();});
 el.addEventListener("pointerup",()=>{if(id==="up"||id==="down")flight.vy=0;});
 el.addEventListener("pointercancel",()=>{flight.vy=0;});
}
bindHold("up",moveUp);bindHold("down",moveDown);bindHold("boost",boost);

window.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown"," ","w","W","s","S"].includes(e.key))e.preventDefault();
 if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")moveUp();
 if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")moveDown();
 if(e.key===" "||e.key==="Shift")boost();
});
window.addEventListener("keyup",e=>{
 if(["ArrowUp","ArrowDown","w","W","s","S"].includes(e.key))flight.vy=0;
});
canvas.addEventListener("pointerdown",e=>{
 if(mode!=="flight")return;
 pointerDown=true;steerTo(e);
});
canvas.addEventListener("pointermove",e=>{if(pointerDown&&mode==="flight")steerTo(e);});
window.addEventListener("pointerup",()=>pointerDown=false);
function steerTo(e){
 const r=canvas.getBoundingClientRect();
 flight.y=clamp((e.clientY-r.top)/r.height,.12,.84);
}
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});

function init(){
 updateHUD();
 say("Elu: Welcome to Crown Jewel! Your adventure starts with a happy dragon and seven flying lives.");
 requestAnimationFrame(loop);
}
init();
})();
</script>
</body>
</html>
